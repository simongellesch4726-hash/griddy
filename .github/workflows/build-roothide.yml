name: Build Griddy (RootHide arm64e)

on:
  push:
    branches:
      - fix/roothide-ios17-arm64e
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: griddy-roothide-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos
  TARGET: iphone:clang:17.0:15.0
  ARCHS: arm64e
  THEOS_PACKAGE_SCHEME: roothide
  THEOS_COMMIT: cfba89a53a05b4a1b822121158acc3669c20602f
  IOS_SDKS_COMMIT: ad607cb07fe4ad1c9b91cf970bd228c2a9253207

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-roothide-theos-cfba89a-iOS17.0-v1

      - name: Install build dependencies
        run: brew install ldid xz dpkg

      - name: Install pinned RootHide Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git init "$THEOS"
          git -C "$THEOS" remote add origin https://github.com/roothide/theos.git
          git -C "$THEOS" fetch --depth 1 origin "$THEOS_COMMIT"
          git -C "$THEOS" checkout --detach FETCH_HEAD
          git -C "$THEOS" submodule update --init --recursive
          test -f "$THEOS/makefiles/common.mk"
          mkdir -p "$THEOS/sdks"

      - name: Install pinned iOS 17.0 SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ ! -f "$THEOS/sdks/iPhoneOS17.0.sdk/SDKSettings.plist" ]; then
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT
            git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$tmpdir/ios-sdks"
            git -C "$tmpdir/ios-sdks" fetch --depth 1 --filter=blob:none origin "$IOS_SDKS_COMMIT"
            git -C "$tmpdir/ios-sdks" sparse-checkout set iPhoneOS17.0.sdk
            git -C "$tmpdir/ios-sdks" checkout --detach "$IOS_SDKS_COMMIT"
            test -d "$tmpdir/ios-sdks/iPhoneOS17.0.sdk"
            cp -R "$tmpdir/ios-sdks/iPhoneOS17.0.sdk" "$THEOS/sdks/"
          fi
          test -f "$THEOS/sdks/iPhoneOS17.0.sdk/SDKSettings.plist"

      - name: Sanity-check build environment
        run: |
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/sdks/iPhoneOS17.0.sdk/SDKSettings.plist"
          xcrun --find clang
          make --version

      - name: Build Griddy
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"

          echo "Package: $deb"
          dpkg-deb -f "$deb" Package Version Architecture
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"

          rm -rf .package-check
          dpkg-deb -x "$deb" .package-check
          dylib="$(find .package-check -type f -name 'Griddy.dylib' -print -quit)"
          test -n "$dylib"
          echo "Dylib: $dylib"
          archs="$(xcrun lipo -archs "$dylib")"
          echo "Dylib architectures: $archs"
          case " $archs " in
            *" arm64e "*) ;;
            *) echo "Griddy.dylib has no arm64e slice" >&2; exit 1 ;;
          esac

          if dpkg-deb --contents "$deb" | grep -E '[[:space:]]\./?var/jb(/|$)'; then
            echo "Unexpected /var/jb path found in RootHide package" >&2
            exit 1
          fi

          echo "Package contents:"
          find .package-check -maxdepth 6 -print | sort
          shasum -a 256 "$deb"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Griddy-RootHide-arm64e
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
