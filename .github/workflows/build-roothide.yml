name: Build Griddy (RootHide arm64e)

# Manual-only while the first development build is being validated.
on:
  push:
    branches:
      - fix/roothide-ios17-arm64e
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: griddy-roothide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/theos
      TARGET: iphone:clang:17.0:15.0
      ARCHS: arm64e
      THEOS_PACKAGE_SCHEME: roothide

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid xz dpkg

      - name: Install pinned RootHide Theos
        env:
          THEOS_COMMIT: cfba89a53a05b4a1b822121158acc3669c20602f
        run: |
          git init "$THEOS"
          git -C "$THEOS" remote add origin https://github.com/roothide/theos.git
          git -C "$THEOS" fetch --depth 1 origin "$THEOS_COMMIT"
          git -C "$THEOS" checkout --detach FETCH_HEAD
          git -C "$THEOS" submodule update --init --recursive
          test -f "$THEOS/makefiles/common.mk"
          mkdir -p "$THEOS/sdks"

      - name: Install pinned iOS SDK
        env:
          IOS_SDKS_COMMIT: ad607cb07fe4ad1c9b91cf970bd228c2a9253207
        run: |
          git clone --depth 1 --filter=blob:none --sparse --no-checkout https://github.com/xybp888/iOS-SDKs.git "$RUNNER_TEMP/ios-sdks"
          git -C "$RUNNER_TEMP/ios-sdks" fetch --depth 1 --filter=blob:none origin "$IOS_SDKS_COMMIT"
          git -C "$RUNNER_TEMP/ios-sdks" sparse-checkout set iPhoneOS17.0.sdk
          git -C "$RUNNER_TEMP/ios-sdks" checkout --detach "$IOS_SDKS_COMMIT"
          test -d "$RUNNER_TEMP/ios-sdks/iPhoneOS17.5.sdk"
          cp -R "$RUNNER_TEMP/ios-sdks/iPhoneOS17.5.sdk" "$THEOS/sdks/"
          test -f "$THEOS/sdks/iPhoneOS17.5.sdk/SDKSettings.plist"

      - name: Sanity-check build environment
        run: |
          test -x "$THEOS/bin/nic.pl" || test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/sdks/iPhoneOS17.5.sdk/SDKSettings.plist"
          xcrun --find clang
          make --version

      - name: Build package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Verify package and binary
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(find . -type f -name '*.deb' -not -path './.git/*' -not -path './theos/*' | sort)
          if [ "${#packages[@]}" -ne 1 ]; then
            printf 'Expected exactly one .deb, found %s\n' "${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          deb="${packages[0]}"
          architecture="$(dpkg-deb --field "$deb" Architecture)"
          echo "Package: $deb"
          echo "Architecture: $architecture"
          test "$architecture" = "iphoneos-arm64e"

          if dpkg-deb --contents "$deb" | grep -E '[[:space:]]\./?var/jb(/|$)'; then
            echo "Unexpected /var/jb path found in RootHide package" >&2
            exit 1
          fi

          payload="$RUNNER_TEMP/griddy-payload"
          mkdir -p "$payload"
          dpkg-deb --extract "$deb" "$payload"
          dylib="$(find "$payload" -type f -name 'Griddy.dylib' -print -quit)"
          test -n "$dylib"
          architectures="$(xcrun lipo -archs "$dylib")"
          echo "Griddy.dylib architectures: $architectures"
          case " $architectures " in
            *" arm64e "*) ;;
            *) echo "Griddy.dylib has no arm64e slice" >&2; exit 1 ;;
          esac

          echo "DEB_PATH=$deb" >> "$GITHUB_ENV"
          shasum -a 256 "$deb"

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Griddy-RootHide-arm64e
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error
          retention-days: 14
